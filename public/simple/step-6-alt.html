<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Step 6 ALT: Contentful CDN with Deferred CSS - Freaking Large Images</title>
    <meta
      name="description"
      content="Using Contentful's Image API with query parameters to serve optimized AVIF images at 600px width and 25% quality, delivered via CDN."
    />
    <!-- Preconnect to Contentful CDN for faster connection -->
    <link rel="preconnect" href="https://images.ctfassets.net" />
    <!-- Preload the LCP image -->
    <link
      rel="preload"
      as="image"
      href="https://images.ctfassets.net/14fez5s3hrmy/ysZqMA6Oy9HbaYKnQcXXp/25ac3869e3b830f887dcd9908015f131/jezael-melgoza-layMbSJ3YOE-unsplash.jpg?fm=avif&w=600&q=60"
      fetchpriority="high"
    />
    <link
      rel="preload"
      as="image"
      href="https://images.ctfassets.net/14fez5s3hrmy/6TF4uKd8b72TBhNRWRBRzt/21a8deb85e80e432c43edd48ef5b1255/nasa-rTZW4f02zY8-unsplash.jpg?fm=avif&w=600&q=60"
      fetchpriority="high"
    />
    <link
      rel="preload"
      as="image"
      href="https://images.ctfassets.net/14fez5s3hrmy/6z0Rzfl7NFPao5iFVLsoA5/c73aa5e41798c532c94ecbfd830c417f/phc-software-3nSnUNGTUqo-unsplash.jpg?fm=avif&w=600&q=60"
      fetchpriority="high"
    />
    <link
      rel="preload"
      as="image"
      href="https://images.ctfassets.net/14fez5s3hrmy/4axEyF0Az0QeLv0V3wICcn/01d608c503905997bf7032d739f67e53/phc-software-Q0ClVjV8ts0-unsplash.jpg?fm=avif&w=600&q=60"
      fetchpriority="high"
    />
    <!-- External CSS file (gzipped by server) -->
    <link rel="stylesheet" href="/simple/step-1.css">
  </head>
  <body class="min-h-screen bg-gray-900 p-4">
    <!-- Header -->
    <header class="text-center mb-8 pt-8">
      <h1 class="text-4xl font-bold text-white mb-2">
        🖼️ Freaking Large Images
      </h1>
      <p class="text-white">
        Step 6: Contentful CDN with avif, 600px width, 60% quality
      </p>
    </header>

    <!-- Main Content - Image Grid -->
    <main class="flex flex-wrap justify-center gap-4 max-w-6xl mx-auto">
      <!-- Image Card 1 - Jezael Melgoza -->
      <div class="w-full sm:w-[calc(50%-0.5rem)]">
        <div class="bg-gray-800 rounded-lg shadow-lg overflow-hidden h-fit">
          <div class="p-4 bg-blue-700">
            <h2 class="font-semibold text-white">Jezael Melgoza Photo</h2>
          </div>
          <div class="p-4">
            <img
              src="https://images.ctfassets.net/14fez5s3hrmy/ysZqMA6Oy9HbaYKnQcXXp/25ac3869e3b830f887dcd9908015f131/jezael-melgoza-layMbSJ3YOE-unsplash.jpg?fm=avif&w=600&q=60"
              alt="Jezael Melgoza Photography"
              class="w-full aspect-video object-cover rounded-md"
              width="600"
              height="337"
              loading="eager"
              fetchpriority="high"
            />
          </div>
        </div>
      </div>

      <!-- Image Card 2 - NASA -->
      <div class="w-full sm:w-[calc(50%-0.5rem)]">
        <div class="bg-gray-800 rounded-lg shadow-lg overflow-hidden h-fit">
          <div class="p-4 bg-purple-700">
            <h2 class="font-semibold text-white">NASA Photo</h2>
          </div>
          <div class="p-4">
            <img
              src="https://images.ctfassets.net/14fez5s3hrmy/6TF4uKd8b72TBhNRWRBRzt/21a8deb85e80e432c43edd48ef5b1255/nasa-rTZW4f02zY8-unsplash.jpg?fm=avif&w=600&q=60"
              alt="NASA Photography"
              class="w-full aspect-video object-cover rounded-md"
              width="600"
              height="337"
              loading="eager"
              fetchpriority="high"
            />
          </div>
        </div>
      </div>

      <!-- Image Card 3 - PHC Software 1 -->
      <div class="w-full sm:w-[calc(50%-0.5rem)]">
        <div class="bg-gray-800 rounded-lg shadow-lg overflow-hidden h-fit">
          <div class="p-4 bg-green-700">
            <h2 class="font-semibold text-white">PHC Software Photo 1</h2>
          </div>
          <div class="p-4">
            <img
              src="https://images.ctfassets.net/14fez5s3hrmy/6z0Rzfl7NFPao5iFVLsoA5/c73aa5e41798c532c94ecbfd830c417f/phc-software-3nSnUNGTUqo-unsplash.jpg?fm=avif&w=600&q=60"
              alt="PHC Software Photography 1"
              class="w-full aspect-video object-cover rounded-md"
              width="600"
              height="337"
              loading="eager"
            />
          </div>
        </div>
      </div>

      <!-- Image Card 4 - PHC Software 2 -->
      <div class="w-full sm:w-[calc(50%-0.5rem)]">
        <div class="bg-gray-800 rounded-lg shadow-lg overflow-hidden h-fit">
          <div class="p-4 bg-orange-700">
            <h2 class="font-semibold text-white">PHC Software Photo 2</h2>
          </div>
          <div class="p-4">
            <img
              src="https://images.ctfassets.net/14fez5s3hrmy/4axEyF0Az0QeLv0V3wICcn/01d608c503905997bf7032d739f67e53/phc-software-Q0ClVjV8ts0-unsplash.jpg?fm=avif&w=600&q=60"
              alt="PHC Software Photography 2"
              class="w-full aspect-video object-cover rounded-md"
              width="600"
              height="337"
              loading="eager"
            />
          </div>
        </div>
      </div>
    </main>
  </body>
</html>
