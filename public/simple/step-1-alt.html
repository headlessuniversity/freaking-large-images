<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Step 1: No Optimization - Freaking Large Images</title>
    <meta
      name="description"
      content="Baseline demonstration with no image optimization. See how large unoptimized images impact page load times and performance before applying optimization techniques."
    />
    <!-- Deferred CSS loading using media print trick -->
    <link rel="stylesheet" href="/simple/step-1.css" media="print" onload="this.media='all'">
    <noscript><link rel="stylesheet" href="/simple/step-1.css"></noscript>
  </head>
  <body class="min-h-screen bg-gray-900 p-4">
    <!-- Header -->
    <header class="text-center mb-8 pt-8">
      <h1 class="text-4xl font-bold text-white mb-2">
        🖼️ Freaking Large Images
      </h1>
    </header>

    <!-- Main Content - Image Grid -->
    <main class="flex flex-wrap justify-center gap-4 max-w-6xl mx-auto">
      <!-- Image Card 1 - Jezael Melgoza -->
      <div class="w-full sm:w-[calc(50%-0.5rem)]">
        <div class="bg-gray-800 rounded-lg shadow-lg overflow-hidden h-fit">
          <div class="p-4 bg-blue-700">
            <h2 class="font-semibold text-white">Jezael Melgoza Photo</h2>
          </div>
          <div class="p-4">
            <img
              src="/images/jezael-melgoza-layMbSJ3YOE-unsplash.jpg"
              alt="Jezael Melgoza Photography"
              class="w-full aspect-video object-cover rounded-md"
              loading="eager"
            />
          </div>
        </div>
      </div>

      <!-- Image Card 2 - NASA -->
      <div class="w-full sm:w-[calc(50%-0.5rem)]">
        <div class="bg-gray-800 rounded-lg shadow-lg overflow-hidden h-fit">
          <div class="p-4 bg-purple-700">
            <h2 class="font-semibold text-white">NASA Photo</h2>
          </div>
          <div class="p-4">
            <img
              src="/images/nasa-rTZW4f02zY8-unsplash.jpg"
              alt="NASA Photography"
              class="w-full aspect-video object-cover rounded-md"
              loading="eager"
            />
          </div>
        </div>
      </div>

      <!-- Image Card 3 - PHC Software 1 -->
      <div class="w-full sm:w-[calc(50%-0.5rem)]">
        <div class="bg-gray-800 rounded-lg shadow-lg overflow-hidden h-fit">
          <div class="p-4 bg-green-700">
            <h2 class="font-semibold text-white">PHC Software Photo 1</h2>
          </div>
          <div class="p-4">
            <img
              src="/images/phc-software-3nSnUNGTUqo-unsplash.jpg"
              alt="PHC Software Photography 1"
              class="w-full aspect-video object-cover rounded-md"
              loading="eager"
            />
          </div>
        </div>
      </div>

      <!-- Image Card 4 - PHC Software 2 -->
      <div class="w-full sm:w-[calc(50%-0.5rem)]">
        <div class="bg-gray-800 rounded-lg shadow-lg overflow-hidden h-fit">
          <div class="p-4 bg-orange-700">
            <h2 class="font-semibold text-white">PHC Software Photo 2</h2>
          </div>
          <div class="p-4">
            <img
              src="/images/phc-software-Q0ClVjV8ts0-unsplash.jpg"
              alt="PHC Software Photography 2"
              class="w-full aspect-video object-cover rounded-md"
              loading="eager"
            />
          </div>
        </div>
      </div>
    </main>
  </body>
</html>
